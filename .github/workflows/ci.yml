name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  rustfmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check
      - run: cargo fmt --manifest-path pytests/Cargo.toml --check

  clippy:
    name: clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            pytests
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo clippy --locked --manifest-path pytests/Cargo.toml --all-targets -- -D warnings

  cargo-test:
    name: cargo test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      # Pinned because the trybuild snapshots in tests/ui/*.stderr quote rustc's diagnostics,
      # which change between releases. Bump it together with a snapshot refresh.
      # rust-src too: with it, rustc quotes std source lines that the snapshots contain.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
          components: rust-src
      - uses: Swatinem/rust-cache@v2
      # The integration tests embed Python, so they link against this interpreter's libpython.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: cargo test --locked
      - run: cargo test --locked --all-features

  rustdoc:
    runs-on: ubuntu-latest
    env:
      # check_rustdoc.py adds its own denials on top of these.
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Builds default and all-feature docs, then checks the rendered API surface and links.
      - run: python3 pytests/check_rustdoc.py

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: msrv
        run: echo "version=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
      # Only the library: dev-dependencies such as trybuild need a newer compiler.
      - run: cargo build --locked --lib
      - run: cargo build --locked --lib --all-features

  ruff:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pytests
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv run --locked ruff check --output-format github .
      - run: uv run --locked ruff format --check .

  typecheck:
    name: typecheck (${{ matrix.checker }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        checker: [mypy, basedpyright]
    defaults:
      run:
        working-directory: pytests
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      # Both read their settings, including mypy's `strict = true`, from pytests/pyproject.toml.
      - run: uv run --locked ${{ matrix.checker }}

  pytest:
    name: pytest (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # The oldest supported Python and the newest.
        python: ["3.11", "3.14"]
    defaults:
      run:
        working-directory: pytests
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: pytests
          key: py${{ matrix.python }}
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python }}
      # conftest.py builds the test extension with Cargo against this interpreter.
      - run: uv run --locked pytest
