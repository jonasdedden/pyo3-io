[package]
name = "pyo3_typed_io_tests"
version = "0.1.0"
edition = "2021"

[lib]
name = "pyo3_typed_io_tests"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29.2", features = ["extension-module", "experimental-inspect"] }
pyo3-typed-io = { path = "..", features = ["experimental-inspect"] }
# For the side-by-side benchmark against the untyped interface
pyo3-file = "=0.17.0"
pyo3-filelike = "0.5.3"

[workspace]
